<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="64x64" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#244d3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A private, opinionated, self-hosted video library." />
    <title>Videos</title>
    <style>
      #app-launch-screen {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        background-color: #f5f6f2;
        background-image: linear-gradient(90deg, rgb(36 77 59 / 2%) 1px, transparent 1px);
        background-size: 42px 42px;
        color: #153326;
        font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
      }

      #app-launch-screen > div {
        display: grid;
        justify-items: center;
        gap: 1rem;
      }

      #app-launch-screen img {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 0.875rem;
        box-shadow: 0 18px 50px rgb(24 32 29 / 12%);
      }

      #app-launch-screen strong {
        font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #app-launch-screen span {
        color: #68716c;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-launch-screen" role="status" aria-label="Opening Videos">
        <div>
          <img src="/favicon.svg" alt="" aria-hidden="true" />
          <strong>Videos</strong>
          <span>Opening your library…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
